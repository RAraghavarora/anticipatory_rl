# Toy Level 2 — dirtiness-focused loop.
# Same 5 locations / 8 objects as toy_level_1_5.yaml.
# Four changes:
#   1. Make one ready cup scarce: cup_0 starts clean at counter, while cup_1
#      and cup_2 start dirty in the bus tub.
#   2. Up-weight the conflicting pair: serve_water strands the ready cup at
#      pass, while wash_objects wants a clean empty cup restored at counter.
#   3. Keep other tasks low so they perturb the loop without dominating it.
#   4. Per-kind reset dirty probabilities remain available for non-overridden
#      objects, independent of spawn location.
locations:
  - name: counter
    coord: [0, 0]
    roles: [countertop]
  - name: coffee_bar
    coord: [1, 0]
    roles: [coffeemachine, fountain]
  - name: sink
    coord: [2, 0]
    roles: [dishwasher]
  - name: pass
    coord: [3, 0]
    roles: [servingtable]
  - name: bus_tub
    coord: [4, 0]

stations:
  water: coffee_bar
  coffee: coffee_bar
  fruit: counter
  wash: sink
  countertop: counter

service_locations:
  - pass

wash_ready_locations:
  - counter

dirty_drop_locations:
  - sink
  - bus_tub

object_kinds: [cup, water, coffeegrinds, apple, bowl, knife]
contents: [empty, water, coffee]

task_types:
  - serve_water
  - make_coffee
  - make_fruit_bowl
  - clear_containers
  - wash_objects
  - pick_place

object_specs:
  - [cup_0, cup]
  - [cup_1, cup]
  - [cup_2, cup]
  - [water_0, water]
  - [coffee_0, coffeegrinds]
  - [apple_0, apple]
  - [bowl_0, bowl]
  - [knife_0, knife]

reset_location_distribution:
  cup:
    counter: 0.5
    bus_tub: 0.5
  water:
    coffee_bar: 1.0
  coffeegrinds:
    coffee_bar: 1.0
  apple:
    counter: 0.5
    coffee_bar: 0.5
  bowl:
    counter: 1.0
  knife:
    counter: 1.0

service_location_distribution:
  pass: 1.0

wash_kind_distribution:
  cup: 1.0

# Per-kind probability that an object spawns dirty, independent of location.
# Omitted kinds default to 0.0 (always clean).  water/coffeegrinds are always
# clean regardless of this block.
reset_dirty_probability:
  knife: 0.6
  bowl: 0.6
  cup: 0.3
  apple: 0.0

reset_object_overrides:
  cup_0:
    location: counter
    dirty: false
  cup_1:
    location: bus_tub
    dirty: true
  cup_2:
    location: bus_tub
    dirty: true

task_distribution:
  serve_water: 0.40        # strands the ready cup at pass
  wash_objects: 0.35       # wants a clean empty cup at counter
  make_coffee: 0.10        # dirties a cup but should not dominate
  clear_containers: 0.05   # clears pass occasionally
  make_fruit_bowl: 0.05
  pick_place: 0.05

paper2_cost:
  enabled: true
  move:
    scale: 25.0
    grid:
      width: 6
      height: 3
      location_cells:
        counter: [0, 1]
        coffee_bar: [1, 1]
        sink: [2, 1]
        pass: [3, 1]
        bus_tub: [4, 1]
