# Toy restaurant config — minimal state/action space, all 6 task types.
# 5 locations in a line: counter — coffee_bar — sink — pass — bus_tub
locations:
  - name: counter
    coord: [0, 0]
    roles: [countertop]
  - name: coffee_bar
    coord: [1, 0]
    roles: [coffeemachine, fountain]
  - name: sink
    coord: [2, 0]
    roles: [dishwasher]
  - name: pass
    coord: [3, 0]
    roles: [servingtable]
  - name: bus_tub
    coord: [4, 0]

stations:
  water: coffee_bar
  coffee: coffee_bar
  fruit: counter
  wash: sink
  countertop: counter

service_locations:
  - pass

wash_ready_locations:
  - counter

dirty_drop_locations:
  - sink
  - bus_tub

object_kinds:
  - cup
  - water
  - coffeegrinds
  - apple
  - bowl
  - knife

contents:
  - empty
  - water
  - coffee

task_types:
  - serve_water
  - make_coffee
  - make_fruit_bowl
  - clear_containers
  - wash_objects
  - pick_place

object_specs:
  - [cup_0, cup]
  - [cup_1, cup]
  - [cup_2, cup]
  - [water_0, water]
  - [coffee_0, coffeegrinds]
  - [apple_0, apple]
  - [bowl_0, bowl]
  - [knife_0, knife]

reset_location_distribution:
  cup:
    counter: 0.5
    bus_tub: 0.5
  water:
    coffee_bar: 1.0
  coffeegrinds:
    coffee_bar: 1.0
  apple:
    counter: 1.0
  bowl:
    counter: 1.0
  knife:
    counter: 1.0

service_location_distribution:
  pass: 1.0

wash_kind_distribution:
  cup: 1.0

task_distribution:
  serve_water: 0.166
  make_coffee: 0.166
  make_fruit_bowl: 0.166
  clear_containers: 0.166
  wash_objects: 0.166
  pick_place: 0.166

paper2_cost:
  enabled: true
  move:
    scale: 25.0
    grid:
      width: 6
      height: 3
      location_cells:
        counter:     [0, 1]
        coffee_bar:  [1, 1]
        sink:        [2, 1]
        pass:        [3, 1]
        bus_tub:     [4, 1]
